<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ribbon Clock | ライブ・タイテ情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            rose: {
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              950: '#4c0519',
            },
            ayu: {
              red: '#ef4444',
              darkred: '#7f1d1d',
            }
          },
          fontFamily: {
            sans: ['"Zen Kaku Gothic New"', '-apple-system', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0c0a09;
      color: #fafaf9;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Zen Kaku Gothic New', sans-serif;
    }
    .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .soft-card {
      background: rgba(28, 25, 23, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-nav-tab {
      background-color: #fb7185;
      color: #0c0a09;
      font-weight: 700;
    }
    /* Lightbox Modal */
    #lightbox-modal {
      display: none;
      touch-action: pinch-zoom;
    }
    #lightbox-modal.active {
      display: flex;
    }
  </style>
</head>
<body class="min-h-screen pb-20 antialiased selection:bg-rose-500/20">

  <!-- Mobile Frame (Max width 420px for perfect one-handed mobile view) -->
  <div class="mx-auto max-w-sm px-3.5 pt-3 space-y-3">

    <!-- Top App Bar: Minimal & Clean Header (タイテ速報・NEXT LIVE削除) -->
    <header class="flex items-center justify-between py-1">
      <div class="flex items-center gap-2">
        <span class="text-xl">🎀</span>
        <span class="text-sm font-bold text-white tracking-wide">リボンクロック</span>
      </div>
    </header>

    <!-- 同日2回し切り替えピル (1部 / 2部) - 最上段で分かりやすく -->
    <div id="session-pills-bar" class="hidden flex gap-1.5 overflow-x-auto pb-0.5">
      <!-- JSでピルボタンを自動注入 -->
    </div>

    <!-- ======================================================== -->
    <!-- VIEW CONTAINER: [NEXT / WEEK / MONTH] -->
    <!-- ======================================================== -->
    
    <!-- 1. [NEXT LIVE COCKPIT VIEW] -->
    <main id="tab-content-next" class="space-y-3">

      <!-- COMPACT HERO STRIP (タップでタイテ画像を全画面拡大) -->
      <section class="relative rounded-xl overflow-hidden soft-card cursor-pointer group shadow-lg" onclick="openLightbox()">
        <div class="relative w-full h-28 bg-stone-900 overflow-hidden">
          <img id="hero-strip-img" 
               src="" 
               alt="Live timetable visual" 
               class="w-full h-full object-cover object-top opacity-85 group-hover:scale-105 transition-transform duration-300">
          
          <div class="absolute inset-0 bg-gradient-to-t from-stone-950 via-stone-950/40 to-transparent"></div>
          
          <!-- Tap hint overlay: アイコンのみでスッキリ -->
          <div class="absolute top-2 right-2 p-1.5 rounded-lg bg-stone-900/80 backdrop-blur-md border border-white/20 text-white flex items-center justify-center shadow">
            <i data-lucide="maximize-2" class="w-4 h-4 text-rose-400"></i>
          </div>

          <!-- Same-day Pill Tag -->
          <div class="absolute top-2 left-2 flex gap-1">
            <span id="session-badge" class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-rose-500 text-stone-950 shadow">
              --
            </span>
          </div>

          <!-- Title Overlaid -->
          <div class="absolute bottom-2 left-3 right-3">
            <h1 id="live-title" class="text-base font-bold text-white truncate drop-shadow-md">
              --
            </h1>
            <div class="flex items-center justify-between text-xs text-stone-200 pt-0.5">
              <span id="live-venue" class="truncate font-semibold flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-400 shrink-0"></i>
                <span id="live-venue-name">--</span>
              </span>
              <span id="live-date-header" class="font-display font-bold text-rose-300 shrink-0 ml-2">--/-- (--)</span>
            </div>
          </div>
        </div>
      </section>

      <!-- PRIMARY COCKPIT TELEMETRY CARD (出番ハイライト ＆ 特典会通常) -->
      <section class="soft-card rounded-2xl p-3.5 space-y-3 shadow-xl">
        
        <!-- Large Dual Time Display: ライブ出番を主役にハイライト！ -->
        <div class="grid grid-cols-2 gap-2.5">
          
          <!-- Stage Live Time (主役：赤・ローズグラデーションで強調) -->
          <div class="bg-gradient-to-br from-rose-950/60 to-stone-900/90 rounded-xl p-3 space-y-1 border-2 border-rose-500/60 shadow-lg shadow-rose-950/40">
            <div class="flex items-center justify-between text-xs font-bold text-rose-300">
              <span class="flex items-center gap-1.5">
                <i data-lucide="mic" class="w-4 h-4 text-rose-400"></i>
                <span>ライブ出番</span>
              </span>
            </div>
            <div class="flex items-baseline gap-1 pt-0.5">
              <span id="live-start" class="text-3xl font-display font-black text-white tracking-tight">--:--</span>
              <span class="text-sm font-display text-stone-400">〜</span>
              <span id="live-end" class="text-lg font-display font-bold text-rose-200">--:--</span>
            </div>
            <div id="live-stage" class="text-xs text-rose-300 font-semibold truncate pt-0.5">--</div>
          </div>

          <!-- Benefit Merch Time (サブ：落ち着いた通常カード) -->
          <div class="bg-stone-900/80 rounded-xl p-3 space-y-1 border border-white/10">
            <div class="flex items-center justify-between text-xs font-bold text-stone-300">
              <span class="flex items-center gap-1.5">
                <i data-lucide="camera" class="w-4 h-4 text-stone-400"></i>
                <span id="benefit-type-label">特典会</span>
              </span>
            </div>
            <div class="flex items-baseline gap-1 pt-0.5">
              <span id="benefit-start" class="text-3xl font-display font-extrabold text-stone-200 tracking-tight">--:--</span>
              <span class="text-sm font-display text-stone-500">〜</span>
              <span id="benefit-end" class="text-lg font-display font-bold text-stone-400">--:--</span>
            </div>
            <div id="benefit-booth" class="text-xs text-stone-400 font-medium truncate pt-0.5">--</div>
          </div>

        </div>

        <!-- High-Priority Highlights: 撮可ルール & 指名入場特典 (文字サイズ拡大) -->
        <div class="space-y-2 text-xs pt-0.5">
          
          <div id="photo-box" class="flex items-start gap-2.5 py-1.5 px-3 rounded-xl bg-stone-900/70 border border-white/5">
            <i data-lucide="aperture" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div class="text-xs leading-relaxed">
              <span class="font-bold text-white" id="photo-status">撮可：</span>
              <span id="photo-desc" class="text-stone-200 font-medium">--</span>
            </div>
          </div>

          <div id="bonus-box" class="flex items-start gap-2.5 py-1.5 px-3 rounded-xl bg-stone-900/70 border border-white/5">
            <i data-lucide="gift" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div class="text-xs leading-relaxed">
              <span class="font-bold text-white">指名特典：</span>
              <span id="bonus-desc" class="text-stone-200 font-medium">--</span>
            </div>
          </div>

          <!-- Special Notes (コスプレ等) -->
          <div id="special-notes-box" class="hidden flex items-start gap-2.5 py-1.5 px-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-200">
            <i data-lucide="sparkles" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div id="special-notes-desc" class="text-xs font-semibold leading-relaxed">--</div>
          </div>

        </div>

        <!-- Ticket Pricing Preview (外部に飛ばなくても価格がわかる) -->
        <div id="ticket-prices-box" class="pt-1.5 border-t border-white/5 space-y-1.5">
          <div class="flex items-center justify-between text-xs text-stone-400 font-semibold px-0.5">
            <span>チケット料金</span>
            <span class="text-[11px] text-stone-500 font-normal">※各チケット+1D</span>
          </div>
          <div id="ticket-prices-list" class="flex flex-wrap gap-1.5">
            <!-- JSで注入 -->
          </div>
        </div>

        <!-- Action Links: チケット ＆ 会場マップ (親指1タップ) -->
        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-white/5">
          <a id="venue-map-link" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-stone-200 font-bold text-xs border border-white/10 transition-colors">
            <i data-lucide="navigation" class="w-3.5 h-3.5 text-rose-400"></i>
            <span>会場マップ</span>
          </a>
          <a id="ticket-link" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-stone-950 font-bold text-xs shadow-md transition-all">
            <i data-lucide="ticket" class="w-3.5 h-3.5"></i>
            <span id="ticket-btn-text">チケット</span>
          </a>
        </div>

      </section>

      <!-- [PROMOTION / AD SLOT CONTAINER] (大・中・小 バリエーション対応コンポーネント) -->
      <section id="promo-container" class="space-y-1.5">
        <!-- JSで動的レンダリング（大中小切替トグル付） -->
      </section>

    </main>

    <!-- 2. [WEEKLY UPCOMING LIST VIEW] -->
    <section id="tab-content-week" class="hidden space-y-3">
      <div class="flex items-center justify-between text-xs px-1">
        <span class="font-bold text-stone-200">今後のライブスケジュール</span>
        <span class="text-[10px] text-rose-400 font-display">UPCOMING</span>
      </div>
      
      <!-- Upcoming list -->
      <div id="upcoming-list" class="space-y-2">
        <!-- JSで注入 -->
      </div>

      <!-- Past archive accordion toggle -->
      <div class="pt-3 border-t border-white/5 text-center">
        <button onclick="togglePastArchive()" class="text-xs text-stone-400 hover:text-stone-200 font-medium flex items-center justify-center gap-1 mx-auto py-1">
          <span>過去のライブ履歴を表示</span>
          <i id="past-icon" data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
        </button>
        <div id="past-list" class="hidden space-y-2 pt-2 text-left">
          <!-- 過去ライブ注入 -->
        </div>
      </div>
    </section>

    <!-- 3. [MONTHLY CALENDAR VIEW] -->
    <section id="tab-content-month" class="hidden space-y-3">
      <div class="flex items-center justify-between text-xs px-1">
        <span class="font-bold text-stone-200">2026年 11月 カレンダー</span>
        <span class="text-[10px] text-rose-400 font-display">MONTHLY</span>
      </div>

      <div class="soft-card rounded-2xl p-3.5 space-y-3">
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-display">
          <span class="text-rose-400 font-bold py-1">SUN</span>
          <span class="text-stone-500 py-1">MON</span>
          <span class="text-stone-500 py-1">TUE</span>
          <span class="text-stone-500 py-1">WED</span>
          <span class="text-stone-500 py-1">THU</span>
          <span class="text-stone-500 py-1">FRI</span>
          <span class="text-blue-400 font-bold py-1">SAT</span>
        </div>
        <div id="calendar-cells" class="grid grid-cols-7 gap-1 text-center text-xs font-display">
          <!-- JSで日付セル生成 -->
        </div>
      </div>

      <!-- Selected day details -->
      <div id="calendar-day-detail" class="space-y-2">
        <div class="text-xs text-stone-400 text-center py-2">日付をタップすると詳細が表示されます</div>
      </div>
    </section>

    <!-- [FLOATING BOTTOM NAVIGATION] (親指でワンタップ切り替え) -->
    <nav class="fixed bottom-3 left-0 right-0 max-w-sm mx-auto px-3.5 z-40">
      <div class="p-1.5 bg-stone-900/95 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl flex items-center justify-around text-xs font-medium">
        <button onclick="setTab('next')" id="nav-next" class="flex-1 py-2 rounded-xl text-center font-bold active-nav-tab transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>直近ライブ</span>
        </button>
        <button onclick="setTab('week')" id="nav-week" class="flex-1 py-2 rounded-xl text-center text-stone-400 hover:text-stone-200 transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          <span>全日程</span>
        </button>
        <button onclick="setTab('month')" id="nav-month" class="flex-1 py-2 rounded-xl text-center text-stone-400 hover:text-stone-200 transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
          <span>カレンダー</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- [FULLSCREEN LIGHTBOX MODAL] (タイテ画像ピンチズーム・拡大) -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex-col justify-between p-4" onclick="closeLightbox()">
    <div class="flex items-center justify-between text-xs text-stone-400 pb-2">
      <span class="flex items-center gap-1 text-rose-300 font-bold">
        <i data-lucide="image" class="w-3.5 h-3.5"></i>
        <span>タイテ公式フライヤー画像</span>
      </span>
      <button onclick="closeLightbox()" class="px-2.5 py-1 rounded-full bg-stone-800 text-white font-bold text-xs">
        ✕ 閉じる
      </button>
    </div>
    
    <div class="flex-1 flex items-center justify-center overflow-auto py-2" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Timetable enlarged" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl">
    </div>

    <div class="text-center text-[11px] text-stone-400 pt-2">
      画面をタップして閉じる / ピンチ操作で拡大できます
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    let appData = null;
    let currentId = null;
    const TODAY_STR = "2026-10-30"; // 基準日

    async function init() {
      try {
        const res = await fetch('mock_schedule.json');
        appData = await res.json();
      } catch (e) {
        console.error('Data load error', e);
      }

      currentId = appData.current_next_id || appData.sessions[0].id;
      renderCockpit(currentId);
      renderUpcomingAndPast();
      renderCalendar();
      renderPromotion('large');
      lucide.createIcons();
    }

    // 1. Render Cockpit
    function renderCockpit(id) {
      const s = appData.sessions.find(x => x.id === id);
      if (!s) return;
      currentId = id;

      // Hero Strip & Image
      const stripImg = document.getElementById('hero-strip-img');
      const lightboxImg = document.getElementById('lightbox-img');
      if (s.image_url) {
        stripImg.src = s.image_url;
        lightboxImg.src = s.image_url;
      }

      document.getElementById('live-title').textContent = s.title;
      document.getElementById('live-venue-name').textContent = s.venue.name;
      document.getElementById('live-date-header').textContent = `${s.date} (${s.day_of_week})`;
      document.getElementById('session-badge').textContent = s.session_name;

      // Telemetry Times: ライブ出番 (主役) / 特典会 (サブ)
      document.getElementById('live-start').textContent = s.live.start_time;
      document.getElementById('live-end').textContent = s.live.end_time;
      document.getElementById('live-stage').textContent = s.live.stage || 'ステージ';

      document.getElementById('benefit-type-label').textContent = `特典会 (${s.benefit.type})`;
      document.getElementById('benefit-start').textContent = s.benefit.start_time;
      document.getElementById('benefit-end').textContent = s.benefit.end_time;
      document.getElementById('benefit-booth').textContent = s.benefit.booth;

      // Photo & Bonus
      const photoStatus = document.getElementById('photo-status');
      const photoDesc = document.getElementById('photo-desc');
      if (s.photo.allowed) {
        photoStatus.textContent = "撮可：";
        photoStatus.className = "font-bold text-rose-400";
        photoDesc.textContent = s.photo.rule;
      } else {
        photoStatus.textContent = "撮禁：";
        photoStatus.className = "font-bold text-stone-400";
        photoDesc.textContent = "撮影不可";
      }

      document.getElementById('bonus-desc').textContent = s.admission_bonus || '特になし';

      // Special Notes
      const notesBox = document.getElementById('special-notes-box');
      if (s.special_notes) {
        notesBox.classList.remove('hidden');
        document.getElementById('special-notes-desc').textContent = s.special_notes;
      } else {
        notesBox.classList.add('hidden');
      }

      // Ticket Prices Preview
      const pricesBox = document.getElementById('ticket-prices-box');
      const pricesList = document.getElementById('ticket-prices-list');
      pricesList.innerHTML = '';
      if (s.ticket && s.ticket.prices && s.ticket.prices.length > 0) {
        pricesBox.classList.remove('hidden');
        s.ticket.prices.forEach(p => {
          const badge = document.createElement('span');
          badge.className = 'px-2 py-0.5 rounded-lg bg-stone-900 border border-white/10 text-xs font-medium text-stone-200';
          badge.innerHTML = `<span class="text-stone-400 mr-1">${p.tier}:</span><strong class="text-rose-300 font-display font-bold">${p.price}</strong>`;
          pricesList.appendChild(badge);
        });
      } else {
        pricesBox.classList.add('hidden');
      }

      // Action Links
      document.getElementById('venue-map-link').href = s.venue.map_url;
      const ticketLink = document.getElementById('ticket-link');
      const ticketBtnText = document.getElementById('ticket-btn-text');
      ticketLink.href = s.ticket.url;
      if (s.ticket.platform === '公式アナウンス待ち') {
        ticketBtnText.textContent = 'チケット (告知待ち)';
        ticketLink.className = 'flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-stone-800 text-stone-300 font-bold text-xs border border-white/10 transition-colors';
      } else {
        ticketBtnText.textContent = s.ticket.platform ? `チケット (${s.ticket.platform})` : 'チケット購入';
        ticketLink.className = 'flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-stone-950 font-bold text-xs shadow-md transition-all';
      }

      // Same-Day Switcher
      renderSameDaySwitcher(s.date);

      lucide.createIcons();
    }

    function renderSameDaySwitcher(date) {
      const sameDay = appData.sessions.filter(x => x.date === date);
      const bar = document.getElementById('session-pills-bar');
      bar.innerHTML = '';

      if (sameDay.length <= 1) {
        bar.classList.add('hidden');
        return;
      }

      bar.classList.remove('hidden');
      sameDay.forEach(item => {
        const btn = document.createElement('button');
        const isActive = item.id === currentId;
        btn.className = `px-3 py-1 rounded-lg text-xs font-display font-semibold transition-all shrink-0 ${
          isActive 
            ? 'bg-rose-500 text-stone-950 font-bold shadow-md' 
            : 'bg-stone-900 text-stone-400 border border-white/5'
        }`;
        btn.textContent = `${item.session_name} (${item.live.start_time}〜)`;
        btn.onclick = () => renderCockpit(item.id);
        bar.appendChild(btn);
      });
    }

    // 2. Render Upcoming and Past
    function renderUpcomingAndPast() {
      const upcomingContainer = document.getElementById('upcoming-list');
      const pastContainer = document.getElementById('past-list');
      upcomingContainer.innerHTML = '';
      pastContainer.innerHTML = '';

      appData.sessions.forEach(s => {
        const isPast = s.date < TODAY_STR;
        const card = document.createElement('div');
        card.className = 'soft-card rounded-xl p-3 space-y-1.5 cursor-pointer hover:border-rose-400/40 transition-all';
        card.onclick = () => {
          renderCockpit(s.id);
          setTab('next');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        card.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <span class="font-display font-bold text-rose-300 text-xs">${s.date} (${s.day_of_week}) ${s.session_name}</span>
            <span class="text-stone-300 truncate max-w-[150px] text-right font-medium text-xs">${s.venue.name}</span>
          </div>
          <div class="text-sm font-bold text-white pt-0.5">${s.title}</div>
          <div class="text-xs font-display text-stone-300 flex justify-between pt-1.5 border-t border-white/5">
            <span>出演: <strong class="text-white font-bold">${s.live.start_time}〜${s.live.end_time}</strong></span>
            <span>物販: <strong class="text-white font-bold">${s.benefit.start_time}〜</strong> (${s.benefit.type})</span>
          </div>
        `;

        if (isPast) {
          card.classList.add('opacity-50');
          pastContainer.appendChild(card);
        } else {
          upcomingContainer.appendChild(card);
        }
      });
    }

    function togglePastArchive() {
      const pastList = document.getElementById('past-list');
      const pastIcon = document.getElementById('past-icon');
      if (pastList.classList.contains('hidden')) {
        pastList.classList.remove('hidden');
        pastIcon.setAttribute('data-lucide', 'chevron-up');
      } else {
        pastList.classList.add('hidden');
        pastIcon.setAttribute('data-lucide', 'chevron-down');
      }
      lucide.createIcons();
    }

    // 3. Render Calendar
    function renderCalendar() {
      const grid = document.getElementById('calendar-cells');
      grid.innerHTML = '';

      // 2026-11-01 is Sunday (index 0)
      for (let day = 1; day <= 30; day++) {
        const dateStr = `2026-11-${String(day).padStart(2, '0')}`;
        const sessions = appData.sessions.filter(s => s.date === dateStr);
        const hasLive = sessions.length > 0;

        const cell = document.createElement('button');
        cell.className = `py-2 rounded-xl flex flex-col items-center justify-center transition-all ${
          hasLive 
            ? 'bg-rose-950/40 border border-rose-500/40 text-rose-300 font-bold shadow-sm' 
            : 'bg-stone-900/40 text-stone-500'
        }`;

        cell.innerHTML = `
          <span>${day}</span>
          ${hasLive ? `<span class="w-1.5 h-1.5 rounded-full mt-1 bg-rose-400"></span>` : '<span class="h-1.5 mt-1"></span>'}
        `;

        if (hasLive) {
          cell.onclick = () => renderCalendarDetail(dateStr, sessions);
        }
        grid.appendChild(cell);
      }
    }

    function renderCalendarDetail(dateStr, sessions) {
      const container = document.getElementById('calendar-day-detail');
      container.innerHTML = '';

      sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'soft-card rounded-xl p-3 space-y-1.5 border-l-4 border-l-rose-500 cursor-pointer';
        div.onclick = () => {
          renderCockpit(s.id);
          setTab('next');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        div.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <span class="font-display font-bold text-rose-300">${s.date} ${s.session_name}</span>
            <span class="text-stone-300 text-xs">${s.venue.name}</span>
          </div>
          <div class="text-sm font-bold text-white pt-0.5">${s.title}</div>
          <div class="text-xs font-display text-stone-300 flex justify-between pt-1.5 border-t border-white/5">
            <span>出演: <strong class="text-white font-bold">${s.live.start_time}〜</strong></span>
            <span>物販: <strong class="text-white font-bold">${s.benefit.start_time}〜</strong> (${s.benefit.type})</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // 4. Render Promotion (大・中・小 バリエーション対応コンポーネント)
    let currentPromoSize = 'large';

    function renderPromotion(size = currentPromoSize) {
      currentPromoSize = size;
      const container = document.getElementById('promo-container');
      if (!container || !appData || !appData.promotions) return;
      const promo = appData.promotions.find(p => p.id === 'promo-ayyu-birthday') || appData.promotions[0];
      if (!promo) return;

      if (size === 'large') {
        container.innerHTML = `
          <div class="rounded-2xl overflow-hidden soft-card border-2 border-rose-500/50 bg-gradient-to-b from-rose-950/40 via-stone-900 to-stone-950 shadow-xl relative group">
            <div class="relative w-full h-32 overflow-hidden bg-stone-900">
              <img src="${promo.image_url}" alt="${promo.title}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300">
              <div class="absolute inset-0 bg-gradient-to-t from-stone-950 via-stone-950/30 to-transparent"></div>
              
              <!-- Badges -->
              <div class="absolute top-2 left-2 flex gap-1.5">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-black bg-red-600 text-white shadow">🎂 生誕祭クラファン</span>
                <span class="px-2 py-0.5 rounded-md text-xs font-bold bg-stone-900/80 backdrop-blur-md text-stone-200 border border-white/10">〜11/22まで</span>
              </div>

              <!-- Size Switcher pills (大/中/小) -->
              <div class="absolute top-2 right-2 flex bg-stone-900/90 backdrop-blur-md rounded-lg p-0.5 border border-white/20 text-[10px]">
                <button onclick="renderPromotion('large')" class="px-1.5 py-0.5 rounded font-bold ${size === 'large' ? 'bg-rose-500 text-stone-950' : 'text-stone-400'}">大</button>
                <button onclick="renderPromotion('medium')" class="px-1.5 py-0.5 rounded font-bold ${size === 'medium' ? 'bg-rose-500 text-stone-950' : 'text-stone-400'}">中</button>
                <button onclick="renderPromotion('small')" class="px-1.5 py-0.5 rounded font-bold ${size === 'small' ? 'bg-rose-500 text-stone-950' : 'text-stone-400'}">小</button>
              </div>
            </div>

            <div class="p-3.5 space-y-2.5">
              <div class="space-y-1">
                <h3 class="text-sm font-extrabold text-white flex items-center gap-1.5">
                  <span class="text-rose-400 font-bold">神楽あゆ 生誕祭2026 ❤️</span>
                  <span class="text-[11px] px-1.5 py-0.2 rounded bg-rose-500/20 text-rose-300 font-bold border border-rose-500/30">20th</span>
                </h3>
                <p class="text-xs text-stone-300 leading-relaxed">初めての生誕祭＆20歳の大切な節目🎀 皆さまと素敵な1日をつくるためのクラファン開催中！</p>
              </div>

              <a href="${promo.cta_url}" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-black text-xs shadow-lg shadow-rose-950/50 transition-all">
                <span>CAMPFIREで支援する</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </div>
        `;
      } else if (size === 'medium') {
        container.innerHTML = `
          <div class="rounded-2xl p-3 soft-card border border-rose-500/40 bg-gradient-to-r from-rose-950/30 to-stone-900 shadow-md relative">
            <div class="absolute top-2 right-2 flex bg-stone-900/90 backdrop-blur-md rounded-lg p-0.5 border border-white/10 text-[10px]">
              <button onclick="renderPromotion('large')" class="px-1.5 py-0.5 rounded font-bold ${size === 'large' ? 'bg-rose-500 text-stone-950' : 'text-stone-400'}">大</button>
              <button onclick="renderPromotion('medium')" class="px-1.5 py-0.5 rounded font-bold ${size === 'medium' ? 'bg-rose-500 text-stone-950' : 'text-stone-400'}">中</button>
              <button onclick="renderPromotion('small')" class="px-1.5 py-0.5 rounded font-bold ${size === 'small' ? 'bg-rose-500 text-stone-950' : 'text-stone-400'}">小</button>
            </div>
            
            <div class="flex items-center gap-3">
              <img src="${promo.image_url}" alt="${promo.title}" class="w-14 h-14 rounded-xl object-cover shrink-0 border border-rose-400/30 shadow">
              <div class="flex-1 min-w-0 pr-14 space-y-1">
                <div class="flex items-center gap-1.5">
                  <span class="text-xs">🎂</span>
                  <h3 class="text-xs font-bold text-rose-200 truncate">神楽あゆ 生誕祭2026 ❤️</h3>
                </div>
                <p class="text-xs text-stone-300 leading-tight truncate">初めての生誕祭＆20歳節目！クラファン開催中</p>
                <a href="${promo.cta_url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-xs font-bold text-rose-400 hover:underline">
                  <span>詳細・支援はこちら</span>
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </a>
              </div>
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="rounded-xl px-3 py-2 soft-card border border-rose-500/30 bg-rose-950/20 flex items-center justify-between text-xs relative">
            <a href="${promo.cta_url}" target="_blank" rel="noopener" class="flex items-center gap-2 truncate flex-1 hover:underline">
              <span class="text-sm">🎂</span>
              <span class="font-bold text-white truncate">神楽あゆ生誕クラファン開催中 (〜11/22)</span>
              <span class="text-rose-400 shrink-0 font-bold ml-1">詳細 ↗</span>
            </a>
            <div class="flex bg-stone-900/90 rounded-md p-0.5 border border-white/10 text-[9px] ml-2 shrink-0">
              <button onclick="renderPromotion('large')" class="px-1 py-0.2 rounded font-bold text-stone-400">大</button>
              <button onclick="renderPromotion('medium')" class="px-1 py-0.2 rounded font-bold text-stone-400">中</button>
              <button onclick="renderPromotion('small')" class="px-1 py-0.2 rounded font-bold bg-rose-500 text-stone-950">小</button>
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    // Tab Switching
    function setTab(tab) {
      ['next', 'week', 'month'].forEach(t => {
        const view = document.getElementById(`tab-content-${t}`);
        const nav = document.getElementById(`nav-${t}`);
        if (t === tab) {
          view.classList.remove('hidden');
          nav.className = 'flex-1 py-2 rounded-xl text-center font-bold active-nav-tab transition-all flex items-center justify-center gap-1.5';
        } else {
          view.classList.add('hidden');
          nav.className = 'flex-1 py-2 rounded-xl text-center text-stone-400 hover:text-stone-200 transition-all flex items-center justify-center gap-1.5';
        }
      });
      lucide.createIcons();
    }

    // Lightbox
    function openLightbox() {
      document.getElementById('lightbox-modal').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
