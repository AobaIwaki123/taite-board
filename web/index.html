<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ribbon Clock | ライブ・タイテ情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            rose: {
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              950: '#4c0519',
            },
            ayu: {
              red: '#ef4444',
              darkred: '#7f1d1d',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Hiragino Sans"', '"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"Hiragino Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    html {
      font-size: 15px; /* スマホで一番読みやすい文字スケールに固定 */
    }
    body {
      background-color: #0c0a09;
      color: #fafaf9;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }
    .font-display {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      font-feature-settings: "palt";
    }
    .soft-card {
      background: rgba(28, 25, 23, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-nav-tab {
      background-color: #fb7185;
      color: #0c0a09;
      font-weight: 700;
    }
    /* Lightbox Modal */
    #lightbox-modal {
      display: none;
      touch-action: pinch-zoom;
    }
    #lightbox-modal.active {
      display: flex;
    }
    /* Logo & Card Micro-Interactions */
    @keyframes ribbon-pop {
      0% { transform: scale(1) rotate(0deg); }
      35% { transform: scale(1.35) rotate(-14deg); }
      70% { transform: scale(1.1) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .animate-ribbon-pop {
      animation: ribbon-pop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes card-refresh {
      0% { opacity: 0.65; transform: scale(0.985); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-card-refresh {
      animation: card-refresh 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="min-h-screen pb-20 antialiased selection:bg-rose-500/20">

  <!-- Mobile Frame (Max width 420px for perfect one-handed mobile view) -->
  <div class="mx-auto max-w-sm px-3.5 pt-3 space-y-3">

    <!-- Top App Bar: Minimal & Clean Header (押し感付きインタラクティブロゴ) -->
    <header class="flex items-center justify-between py-1 border-b border-white/5 pb-2">
      <button onclick="handleLogoClick()" class="flex items-center gap-2 py-1 px-2 -ml-2 rounded-xl hover:bg-white/5 active:scale-90 transition-all duration-150 select-none group cursor-pointer focus:outline-none" title="直近ライブへジャンプ">
        <span id="logo-icon" class="text-xl inline-block transition-transform duration-200 group-hover:scale-110">🎀</span>
        <span class="text-base font-extrabold text-white tracking-wide group-hover:text-rose-300 transition-colors">リボンクロック</span>
      </button>
    </header>

    <!-- 戻るナビゲーションバー（他日程のライブ詳細を閲覧中のみ表示） -->
    <div id="subpage-nav-bar" class="hidden flex items-center justify-between py-1 px-1 bg-stone-900/90 rounded-xl border border-white/10 shadow-md">
      <button onclick="goBackToList()" class="flex items-center gap-1.5 text-xs font-bold text-stone-300 hover:text-white py-1 px-2.5 rounded-lg bg-stone-800 hover:bg-stone-700 transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>一覧に戻る</span>
      </button>
      <button onclick="goToNextLive()" class="flex items-center gap-1.5 text-xs font-bold text-rose-300 hover:text-white py-1 px-2.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 transition-colors">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-rose-400"></i>
        <span>直近ライブに戻る</span>
      </button>
    </div>

    <!-- ======================================================== -->
    <!-- VIEW CONTAINER: [NEXT / WEEK / MONTH] -->
    <!-- ======================================================== -->
    
    <!-- 1. [NEXT LIVE COCKPIT VIEW] -->
    <main id="tab-content-next" class="space-y-3">

      <!-- 同日2回し切り替えピル (1部 / 2部) - コックピット内のみ表示 -->
      <div id="session-pills-bar" class="hidden flex gap-1.5 overflow-x-auto pb-0.5">
        <!-- JSでピルボタンを自動注入 -->
      </div>

      <!-- HERO FLYER PREVIEW & EVENT INFO (画像の上に文字を被せずスッキリ分離) -->
      <section class="rounded-2xl overflow-hidden soft-card shadow-xl cursor-pointer group active:scale-[0.98] transition-all duration-150" onclick="openLightbox()">
        <!-- フライヤー画像プレビュー（文字被せゼロ、見切れOK、右上に控えめな拡大アイコン） -->
        <div class="relative w-full h-36 bg-stone-950 overflow-hidden">
          <img id="hero-strip-img" 
               src="" 
               alt="Flyer visual preview" 
               class="w-full h-full object-cover object-top opacity-95 group-hover:scale-105 transition-transform duration-300">
          
          <!-- Tap hint overlay: 右上に小さくスッキリ配置 -->
          <div class="absolute top-2 right-2 p-1.5 rounded-lg bg-stone-950/70 backdrop-blur-md border border-white/20 text-white shadow">
            <i data-lucide="maximize-2" class="w-3.5 h-3.5 text-rose-300"></i>
          </div>
        </div>

        <!-- 画像の下にイベントタイトル・会場・日付をクリアに配置（文字被り一切なし） -->
        <div class="p-3 bg-stone-900/90 border-t border-white/5 space-y-1">
          <h1 id="live-title" class="text-base font-extrabold text-white truncate">
            --
          </h1>
          <div class="flex items-center justify-between text-xs text-stone-300 pt-0.5">
            <span id="live-venue" class="truncate font-semibold flex items-center gap-1.5">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-400 shrink-0"></i>
              <span id="live-venue-name">--</span>
            </span>
            <span id="live-date-header" class="font-display font-bold text-rose-300 shrink-0 ml-2">--/-- (--)</span>
          </div>
        </div>
      </section>

      <!-- PRIMARY COCKPIT TELEMETRY CARD (出番ハイライト ＆ 特典会通常) -->
      <section class="soft-card rounded-2xl p-3 space-y-3 shadow-xl">
        
        <!-- Large Dual Time Display: ライブ出番を主役にハイライト（文字切れを完全防止） -->
        <div class="grid grid-cols-2 gap-2">
          
          <!-- Stage Live Time (主役：赤・ローズグラデーションで強調) -->
          <div class="bg-gradient-to-br from-rose-950/60 to-stone-900/90 rounded-xl px-2.5 py-2.5 space-y-1 border-2 border-rose-500/60 shadow-lg shadow-rose-950/40">
            <div class="flex items-center justify-between text-xs font-bold text-rose-300">
              <span class="flex items-center gap-1.5">
                <i data-lucide="mic" class="w-4 h-4 text-rose-400"></i>
                <span>ライブ出番</span>
              </span>
            </div>
            <div class="flex items-baseline gap-1 pt-0.5 overflow-hidden">
              <span id="live-start" class="text-2xl font-display font-black text-white tracking-tight shrink-0">--:--</span>
              <span class="text-xs font-display text-stone-400 shrink-0">〜</span>
              <span id="live-end" class="text-sm font-display font-bold text-rose-200 tracking-tight shrink-0">--:--</span>
            </div>
            <div id="live-stage" class="text-xs text-rose-300 font-semibold truncate pt-0.5">--</div>
          </div>

          <!-- Benefit Merch Time (サブ：落ち着いた通常カード) -->
          <div class="bg-stone-900/80 rounded-xl px-2.5 py-2.5 space-y-1 border border-white/10">
            <div class="flex items-center justify-between text-xs font-bold text-stone-300">
              <span class="flex items-center gap-1.5">
                <i data-lucide="camera" class="w-4 h-4 text-stone-400"></i>
                <span id="benefit-type-label">特典会</span>
              </span>
            </div>
            <div class="flex items-baseline gap-1 pt-0.5 overflow-hidden">
              <span id="benefit-start" class="text-2xl font-display font-extrabold text-stone-200 tracking-tight shrink-0">--:--</span>
              <span class="text-xs font-display text-stone-500 shrink-0">〜</span>
              <span id="benefit-end" class="text-sm font-display font-bold text-stone-400 tracking-tight shrink-0">--:--</span>
            </div>
            <div id="benefit-booth" class="text-xs text-stone-400 font-medium truncate pt-0.5">--</div>
          </div>

        </div>

        <!-- High-Priority Highlights: 撮可ルール & 指名入場特典 (文字サイズ拡大) -->
        <div class="space-y-2 text-xs pt-0.5">
          
          <div id="photo-box" class="flex items-start gap-2.5 py-1.5 px-3 rounded-xl bg-stone-900/70 border border-white/5">
            <i data-lucide="aperture" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div class="text-xs leading-relaxed">
              <span class="font-bold text-white" id="photo-status">撮可：</span>
              <span id="photo-desc" class="text-stone-200 font-medium">--</span>
            </div>
          </div>

          <div id="bonus-box" class="flex items-start gap-2.5 py-1.5 px-3 rounded-xl bg-stone-900/70 border border-white/5">
            <i data-lucide="gift" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div class="text-xs leading-relaxed">
              <span class="font-bold text-white">指名特典：</span>
              <span id="bonus-desc" class="text-stone-200 font-medium">--</span>
            </div>
          </div>

          <!-- Special Notes (コスプレ等) -->
          <div id="special-notes-box" class="hidden flex items-start gap-2.5 py-1.5 px-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-200">
            <i data-lucide="sparkles" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div id="special-notes-desc" class="text-xs font-semibold leading-relaxed">--</div>
          </div>

        </div>

        <!-- Ticket Pricing Preview (外部に飛ばなくても価格がわかる) -->
        <div id="ticket-prices-box" class="pt-1.5 border-t border-white/5 space-y-1.5">
          <div class="flex items-center justify-between text-xs text-stone-400 font-semibold px-0.5">
            <span>チケット料金</span>
            <span class="text-[11px] text-stone-500 font-normal">※各チケット+1D</span>
          </div>
          <div id="ticket-prices-list" class="flex flex-wrap gap-1.5">
            <!-- JSで注入 -->
          </div>
        </div>

        <!-- Action Links: チケット ＆ 会場マップ (親指1タップ) -->
        <div class="grid grid-cols-2 gap-2 pt-1 border-t border-white/5">
          <a id="venue-map-link" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-stone-200 font-bold text-xs border border-white/10 transition-colors">
            <i data-lucide="navigation" class="w-3.5 h-3.5 text-rose-400"></i>
            <span>会場マップ</span>
          </a>
          <a id="ticket-link" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-stone-950 font-bold text-xs shadow-md transition-all">
            <i data-lucide="ticket" class="w-3.5 h-3.5"></i>
            <span id="ticket-btn-text">チケット</span>
          </a>
        </div>

      </section>

      <!-- [PROMOTION / AD SLOT CONTAINER] (大・中・小 バリエーション対応コンポーネント) -->
      <section id="promo-container" class="space-y-1.5">
        <!-- JSで動的レンダリング（大中小切替トグル付） -->
      </section>

    </main>

    <!-- 2. [UPCOMING LIVE SCHEDULE LIST] (目が滑らないカレンダーバッジ付きリスト) -->
    <section id="tab-content-week" class="hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <span class="text-sm font-extrabold text-white">ライブ日程一覧</span>
        <span id="upcoming-count-badge" class="text-xs font-bold text-rose-300 bg-rose-500/20 px-2.5 py-0.5 rounded-full border border-rose-500/30">--公演</span>
      </div>
      
      <!-- Upcoming list -->
      <div id="upcoming-list" class="space-y-2.5">
        <!-- JSで日付バッジ付きカードを注入 -->
      </div>
    </section>

    <!-- 3. [MONTHLY CALENDAR VIEW] (月送りで過去・未来を自在に閲覧) -->
    <section id="tab-content-month" class="hidden space-y-3">
      <div class="flex items-center justify-between px-1">
        <button onclick="changeCalendarMonth(-1)" class="py-1 px-2 rounded-lg bg-stone-900 border border-white/10 text-xs font-bold text-stone-300 hover:text-white flex items-center gap-1 transition-colors">
          <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          <span id="prev-month-label">10月</span>
        </button>
        <span id="calendar-header-title" class="text-sm font-extrabold text-white">2026年 11月</span>
        <button onclick="changeCalendarMonth(1)" class="py-1 px-2 rounded-lg bg-stone-900 border border-white/10 text-xs font-bold text-stone-300 hover:text-white flex items-center gap-1 transition-colors">
          <span id="next-month-label">12月</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <div class="soft-card rounded-2xl p-3.5 space-y-3 shadow-xl">
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold">
          <span class="text-rose-400 py-1">日</span>
          <span class="text-stone-400 py-1">月</span>
          <span class="text-stone-400 py-1">火</span>
          <span class="text-stone-400 py-1">水</span>
          <span class="text-stone-400 py-1">木</span>
          <span class="text-stone-400 py-1">金</span>
          <span class="text-blue-400 py-1">土</span>
        </div>
        <div id="calendar-cells" class="grid grid-cols-7 gap-1 text-center text-xs">
          <!-- JSで日付セル生成 -->
        </div>
      </div>

      <!-- Selected day details -->
      <div id="calendar-day-detail" class="space-y-2">
        <div class="text-xs text-stone-400 text-center py-2">日付をタップすると詳細が表示されます</div>
      </div>
    </section>

    <!-- [FLOATING BOTTOM NAVIGATION] (親指でワンタップ切り替え) -->
    <nav class="fixed bottom-3 left-0 right-0 max-w-sm mx-auto px-3.5 z-40">
      <div class="p-1.5 bg-stone-900/95 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl flex items-center justify-around text-xs font-medium">
        <button onclick="handleNextTabClick()" id="nav-next" class="flex-1 py-2 rounded-xl text-center font-bold active-nav-tab transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>直近ライブ</span>
        </button>
        <button onclick="setTab('week')" id="nav-week" class="flex-1 py-2 rounded-xl text-center text-stone-400 hover:text-stone-200 transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          <span>全日程</span>
        </button>
        <button onclick="setTab('month')" id="nav-month" class="flex-1 py-2 rounded-xl text-center text-stone-400 hover:text-stone-200 transition-all flex items-center justify-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
          <span>カレンダー</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- [FULLSCREEN LIGHTBOX MODAL] (タイテ画像ピンチズーム・拡大) -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex-col justify-between p-4" onclick="closeLightbox()">
    <div class="flex items-center justify-between text-xs text-stone-400 pb-2">
      <span class="flex items-center gap-1 text-rose-300 font-bold">
        <i data-lucide="image" class="w-3.5 h-3.5"></i>
        <span>タイテ公式フライヤー画像</span>
      </span>
      <button onclick="closeLightbox()" class="px-2.5 py-1 rounded-full bg-stone-800 text-white font-bold text-xs">
        ✕ 閉じる
      </button>
    </div>
    
    <div class="flex-1 flex items-center justify-center overflow-auto py-2" onclick="event.stopPropagation()">
      <img id="lightbox-img" src="" alt="Timetable enlarged" class="max-w-full max-h-[80vh] object-contain rounded-lg shadow-2xl">
    </div>

    <div class="text-center text-[11px] text-stone-400 pt-2">
      画面をタップして閉じる / ピンチ操作で拡大できます
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    let appData = null;
    let currentId = null;
    let previousTab = 'week';
    const TODAY_STR = "2026-10-30"; // 基準日
    let currentCalYear = 2026;
    let currentCalMonth = 11; // 1-12

    async function init() {
      try {
        const res = await fetch('mock_schedule.json');
        appData = await res.json();
      } catch (e) {
        console.error('Data load error', e);
      }

      currentId = appData.current_next_id || appData.sessions[0].id;
      renderCockpit(currentId);
      renderUpcomingList();
      renderCalendar(currentCalYear, currentCalMonth);
      renderPromotion('large');
      lucide.createIcons();
    }

    // 1. Render Cockpit
    function renderCockpit(id) {
      const s = appData.sessions.find(x => x.id === id);
      if (!s) return;
      currentId = id;

      // Flyer Image Preview
      const stripImg = document.getElementById('hero-strip-img');
      const lightboxImg = document.getElementById('lightbox-img');
      if (s.image_url) {
        stripImg.src = s.image_url;
        lightboxImg.src = s.image_url;
      }

      document.getElementById('live-title').textContent = s.title;
      document.getElementById('live-venue-name').textContent = s.venue.name;
      document.getElementById('live-date-header').textContent = `${s.date} (${s.day_of_week})`;

      // 同日2回しピル（1部/2部）の更新 (コックピット内のみ)
      renderSameDaySwitcher(s.date);

      // Telemetry Times: ライブ出番 (主役) / 特典会 (サブ)
      document.getElementById('live-start').textContent = s.live.start_time;
      document.getElementById('live-end').textContent = s.live.end_time;
      document.getElementById('live-stage').textContent = s.live.stage || 'ステージ';

      document.getElementById('benefit-type-label').textContent = `特典会 (${s.benefit.type})`;
      document.getElementById('benefit-start').textContent = s.benefit.start_time;
      document.getElementById('benefit-end').textContent = s.benefit.end_time;
      document.getElementById('benefit-booth').textContent = s.benefit.booth;

      // Photo Rule (曲名や楽曲情報がある場合のみ表示。不明・確認中は非表示)
      const photoBox = document.getElementById('photo-box');
      if (s.photo && s.photo.allowed && s.photo.rule && !s.photo.rule.includes('確認') && !s.photo.rule.includes('未定')) {
        photoBox.classList.remove('hidden');
        document.getElementById('photo-status').textContent = "撮可：";
        document.getElementById('photo-desc').textContent = s.photo.rule;
      } else {
        photoBox.classList.add('hidden');
      }

      // Bonus
      document.getElementById('bonus-desc').textContent = s.admission_bonus || '特になし';

      // Special Notes
      const notesBox = document.getElementById('special-notes-box');
      if (s.special_notes) {
        notesBox.classList.remove('hidden');
        document.getElementById('special-notes-desc').textContent = s.special_notes;
      } else {
        notesBox.classList.add('hidden');
      }

      // Ticket Prices Preview
      const pricesBox = document.getElementById('ticket-prices-box');
      const pricesList = document.getElementById('ticket-prices-list');
      pricesList.innerHTML = '';
      if (s.ticket && s.ticket.prices && s.ticket.prices.length > 0) {
        pricesBox.classList.remove('hidden');
        s.ticket.prices.forEach(p => {
          const badge = document.createElement('span');
          badge.className = 'px-2 py-0.5 rounded-lg bg-stone-900 border border-white/10 text-xs font-medium text-stone-200';
          badge.innerHTML = `<span class="text-stone-400 mr-1">${p.tier}:</span><strong class="text-rose-300 font-display font-bold">${p.price}</strong>`;
          pricesList.appendChild(badge);
        });
      } else {
        pricesBox.classList.add('hidden');
      }

      // Action Links
      document.getElementById('venue-map-link').href = s.venue.map_url;
      const ticketLink = document.getElementById('ticket-link');
      const ticketBtnText = document.getElementById('ticket-btn-text');
      ticketLink.href = s.ticket.url;
      if (s.ticket.platform === '公式アナウンス待ち') {
        ticketBtnText.textContent = 'チケット (告知待ち)';
        ticketLink.className = 'flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-stone-800 text-stone-300 font-bold text-xs border border-white/10 transition-colors';
      } else {
        ticketBtnText.textContent = s.ticket.platform ? `チケット (${s.ticket.platform})` : 'チケット購入';
        ticketLink.className = 'flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-stone-950 font-bold text-xs shadow-md transition-all';
      }

      // Subpage Nav Bar (直近以外の公演を閲覧中のみ表示)
      const nextId = appData.current_next_id || appData.sessions[0].id;
      const isNextLive = id === nextId;
      const subpageNav = document.getElementById('subpage-nav-bar');
      if (subpageNav) {
        if (isNextLive) {
          subpageNav.classList.add('hidden');
        } else {
          subpageNav.classList.remove('hidden');
        }
      }

      lucide.createIcons();
    }

    function renderSameDaySwitcher(date) {
      const sameDay = appData.sessions.filter(x => x.date === date);
      const bar = document.getElementById('session-pills-bar');
      bar.innerHTML = '';

      if (sameDay.length <= 1) {
        bar.classList.add('hidden');
        return;
      }

      bar.classList.remove('hidden');
      sameDay.forEach(item => {
        const btn = document.createElement('button');
        const isActive = item.id === currentId;
        btn.className = `px-3 py-1.5 rounded-lg text-xs font-display font-semibold transition-all shrink-0 ${
          isActive 
            ? 'bg-rose-500 text-stone-950 font-bold shadow-md' 
            : 'bg-stone-900 text-stone-400 border border-white/5'
        }`;
        const label = item.session_name.includes('昼') ? '☀️ 昼公演' : (item.session_name.includes('夜') ? '🌙 夜公演' : item.session_name);
        btn.textContent = `${label} (${item.live.start_time}〜)`;
        btn.onclick = () => renderCockpit(item.id);
        bar.appendChild(btn);
      });
    }

    // 2. Render Upcoming Schedule List (目が滑らないカレンダーバッジUI)
    function renderUpcomingList() {
      const container = document.getElementById('upcoming-list');
      container.innerHTML = '';

      // 今後の公演のみ抽出
      const upcoming = appData.sessions.filter(s => s.date >= TODAY_STR);
      
      const countBadge = document.getElementById('upcoming-count-badge');
      if (countBadge) countBadge.textContent = `${upcoming.length}公演`;

      upcoming.forEach(s => {
        const card = document.createElement('div');
        card.className = 'soft-card rounded-2xl p-3 flex items-center gap-3.5 cursor-pointer hover:border-rose-400/40 transition-all shadow-md';
        card.onclick = () => openSessionDetail(s.id, 'week');

        // 日付・月・曜日の抽出
        const [, mStr, dStr] = s.date.split('-');
        const monthNum = parseInt(mStr, 10);
        const dayNum = parseInt(dStr, 10);
        
        // 曜日カラー
        let dayColor = 'text-stone-400';
        if (s.day_of_week === '土') dayColor = 'text-blue-400';
        if (s.day_of_week === '日' || s.day_of_week.includes('祝')) dayColor = 'text-rose-400';

        const sameDayCount = appData.sessions.filter(x => x.date === s.date).length;
        const sessionTag = sameDayCount > 1 ? (s.session_name.includes('昼') ? ' [昼]' : ' [夜]') : '';

        card.innerHTML = `
          <!-- カレンダー風・日付アンカーブロック (目が滑らない) -->
          <div class="w-13 h-14 w-[52px] h-[56px] rounded-xl bg-stone-950 border border-white/10 flex flex-col items-center justify-center shrink-0 shadow-inner">
            <span class="text-[10px] font-bold text-stone-400 leading-none">${monthNum}月</span>
            <span class="text-xl font-display font-black text-white leading-tight my-0.5">${dayNum}</span>
            <span class="text-[10px] font-bold ${dayColor} leading-none">${s.day_of_week}</span>
          </div>

          <!-- イベント情報本体 -->
          <div class="flex-1 min-w-0 space-y-1">
            <div class="flex items-center justify-between text-xs">
              <span class="text-stone-300 font-semibold truncate flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3 h-3 text-rose-400 shrink-0"></i>
                <span class="truncate">${s.venue.name}</span>
              </span>
              ${sessionTag ? `<span class="px-1.5 py-0.2 rounded bg-rose-500/20 text-rose-300 font-bold text-[10px]">${sessionTag}</span>` : ''}
            </div>

            <div class="text-sm font-extrabold text-white leading-snug line-clamp-2">${s.title}</div>

            <div class="text-xs flex items-center justify-between pt-1 border-t border-white/5 text-stone-300">
              <span class="flex items-center gap-1">
                <span class="text-rose-400 font-bold">出番</span>
                <strong class="text-white font-display font-bold">${s.live.start_time}〜</strong>
              </span>
              <span class="flex items-center gap-1 text-stone-400">
                <span>特典会</span>
                <strong class="text-stone-200 font-display">${s.benefit.start_time}〜</strong>
              </span>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
      lucide.createIcons();
    }

    // 3. Render Calendar (月送りで過去・未来を無限に遡れる)
    function changeCalendarMonth(delta) {
      currentCalMonth += delta;
      if (currentCalMonth > 12) {
        currentCalMonth = 1;
        currentCalYear++;
      } else if (currentCalMonth < 1) {
        currentCalMonth = 12;
        currentCalYear--;
      }
      renderCalendar(currentCalYear, currentCalMonth);
    }

    function renderCalendar(year, month) {
      const headerTitle = document.getElementById('calendar-header-title');
      if (headerTitle) headerTitle.textContent = `${year}年 ${month}月`;

      const prevLabel = document.getElementById('prev-month-label');
      const nextLabel = document.getElementById('next-month-label');
      if (prevLabel) prevLabel.textContent = `${month === 1 ? 12 : month - 1}月`;
      if (nextLabel) nextLabel.textContent = `${month === 12 ? 1 : month + 1}月`;

      const grid = document.getElementById('calendar-cells');
      grid.innerHTML = '';

      // 月の日数と1日の曜日インデックスを取得
      const firstDayIndex = new Date(year, month - 1, 1).getDay(); // 0 = Sun
      const daysInMonth = new Date(year, month, 0).getDate();

      // 前月の空白埋め
      for (let i = 0; i < firstDayIndex; i++) {
        const blank = document.createElement('div');
        blank.className = 'py-2.5 text-stone-700';
        grid.appendChild(blank);
      }

      // 日付セルの描画
      for (let day = 1; day <= daysInMonth; day++) {
        const monthStr = String(month).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const dateStr = `${year}-${monthStr}-${dayStr}`;
        const sessions = appData ? appData.sessions.filter(s => s.date === dateStr) : [];
        const hasLive = sessions.length > 0;

        const cell = document.createElement('button');
        cell.className = `py-2 rounded-xl flex flex-col items-center justify-center transition-all ${
          hasLive 
            ? 'bg-rose-950/50 border-2 border-rose-500/60 text-white font-extrabold shadow-sm scale-105' 
            : 'bg-stone-900/30 text-stone-500 hover:text-stone-400'
        }`;

        cell.innerHTML = `
          <span class="text-xs font-display">${day}</span>
          ${hasLive ? `<span class="w-1.5 h-1.5 rounded-full mt-1 bg-rose-400 animate-pulse"></span>` : '<span class="h-1.5 mt-1"></span>'}
        `;

        if (hasLive) {
          cell.onclick = () => renderCalendarDetail(dateStr, sessions);
        }
        grid.appendChild(cell);
      }

      // 詳細カードのクリア
      const detailContainer = document.getElementById('calendar-day-detail');
      if (detailContainer) {
        detailContainer.innerHTML = '<div class="text-xs text-stone-400 text-center py-2">日付をタップすると詳細が表示されます</div>';
      }
      lucide.createIcons();
    }

    function renderCalendarDetail(dateStr, sessions) {
      const container = document.getElementById('calendar-day-detail');
      container.innerHTML = '';

      sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = 'soft-card rounded-xl p-3 space-y-1.5 border-l-4 border-l-rose-500 cursor-pointer hover:border-rose-400/40 transition-all';
        div.onclick = () => openSessionDetail(s.id, 'month');

        const sessionTag = sessions.length > 1 ? (s.session_name.includes('昼') ? ' [昼公演]' : ' [夜公演]') : '';
        div.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <span class="font-display font-bold text-rose-300">${s.date}${sessionTag}</span>
            <span class="text-stone-300 text-xs">${s.venue.name}</span>
          </div>
          <div class="text-sm font-bold text-white pt-0.5">${s.title}</div>
          <div class="text-xs font-display text-stone-300 flex justify-between pt-1.5 border-t border-white/5">
            <span>出演: <strong class="text-white font-bold">${s.live.start_time}〜</strong></span>
            <span>物販: <strong class="text-white font-bold">${s.benefit.start_time}〜</strong> (${s.benefit.type})</span>
          </div>
        `;
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    // 4. Render Promotion (大・中・小 バリエーション対応コンポーネント)
    // ※ 20thラベル削除、画像の上に文字被せゼロ
    function renderPromotion(size = 'large') {
      const container = document.getElementById('promo-container');
      if (!container || !appData || !appData.promotions) return;
      const promo = appData.promotions.find(p => p.id === 'promo-ayyu-birthday') || appData.promotions[0];
      if (!promo) return;

      if (size === 'large') {
        container.innerHTML = `
          <div class="rounded-2xl overflow-hidden soft-card border-2 border-rose-500/50 bg-stone-900 shadow-xl">
            <!-- 画像枠（画像の上に文字・ラベルを一切被せず、推しの顔を保護。見切れOK） -->
            <div class="w-full h-44 overflow-hidden bg-stone-950">
              <img src="${promo.image_url}" alt="${promo.title}" class="w-full h-full object-cover object-center">
            </div>

            <!-- 画像の下に全情報を集約配置 (20th削除) -->
            <div class="p-3.5 space-y-2.5 bg-stone-900">
              <div class="flex items-center justify-between">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-black bg-red-600 text-white shadow">🎂 生誕祭クラファン</span>
                <span class="text-xs font-bold text-rose-300">受付期間：〜11/22まで</span>
              </div>

              <div class="space-y-1">
                <h3 class="text-base font-extrabold text-white">
                  <span class="text-rose-400 font-bold">神楽あゆ 生誕祭2026 ❤️</span>
                </h3>
                <p class="text-xs text-stone-300 leading-relaxed">初めての生誕祭＆20歳の大切な節目🎀 皆さまと素敵な1日をつくるためのクラファン開催中！</p>
              </div>

              <a href="${promo.cta_url}" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-black text-xs shadow-lg shadow-rose-950/50 transition-all">
                <span>CAMPFIREで支援する</span>
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
              </a>
            </div>
          </div>
        `;
      } else if (size === 'medium') {
        container.innerHTML = `
          <div class="rounded-2xl p-3 soft-card border border-rose-500/40 bg-stone-900 shadow-md">
            <div class="flex items-center gap-3">
              <img src="${promo.image_url}" alt="${promo.title}" class="w-16 h-16 rounded-xl object-cover shrink-0 border border-rose-400/30 shadow">
              <div class="flex-1 min-w-0 space-y-1">
                <div class="flex items-center justify-between">
                  <span class="px-2 py-0.5 rounded text-[11px] font-bold bg-red-600 text-white">🎂 生誕祭クラファン</span>
                  <span class="text-[11px] font-medium text-rose-300">〜11/22</span>
                </div>
                <h3 class="text-xs font-bold text-white truncate">神楽あゆ 生誕祭2026 ❤️</h3>
                <a href="${promo.cta_url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-xs font-bold text-rose-400 hover:underline">
                  <span>CAMPFIREで支援 ↗</span>
                </a>
              </div>
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="rounded-xl px-3 py-2 soft-card border border-rose-500/30 bg-rose-950/20 flex items-center justify-between text-xs">
            <a href="${promo.cta_url}" target="_blank" rel="noopener" class="flex items-center gap-2 truncate flex-1 hover:underline">
              <span class="text-sm">🎂</span>
              <span class="font-bold text-white truncate">神楽あゆ生誕クラファン開催中 (〜11/22)</span>
              <span class="text-rose-400 shrink-0 font-bold ml-1">支援 ↗</span>
            </a>
          </div>
        `;
      }
      lucide.createIcons();
    }

    // 5. Navigation & History Helpers
    function handleLogoClick() {
      // 1. リボンアイコンの弾けるマイクロアニメーション
      const icon = document.getElementById('logo-icon');
      if (icon) {
        icon.classList.remove('animate-ribbon-pop');
        void icon.offsetWidth;
        icon.classList.add('animate-ribbon-pop');
      }

      // 2. コックピットカードのリフレッシュ・アニメーション（直近ページ閲覧中でも反応が伝わる）
      const cockpit = document.getElementById('tab-content-next');
      if (cockpit) {
        cockpit.classList.remove('animate-card-refresh');
        void cockpit.offsetWidth;
        cockpit.classList.add('animate-card-refresh');
      }

      // 3. 直近ライブへジャンプ
      goToNextLive();
    }

    function openSessionDetail(id, fromTab = 'week') {
      previousTab = fromTab;
      renderCockpit(id);
      setTab('next');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToNextLive() {
      const nextId = appData.current_next_id || appData.sessions[0].id;
      renderCockpit(nextId);
      setTab('next');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goBackToList() {
      setTab(previousTab || 'week');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleNextTabClick() {
      const nextId = appData.current_next_id || appData.sessions[0].id;
      if (currentId !== nextId) {
        renderCockpit(nextId);
      }
      setTab('next');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Tab Switching
    function setTab(tab) {
      ['next', 'week', 'month'].forEach(t => {
        const view = document.getElementById(`tab-content-${t}`);
        const nav = document.getElementById(`nav-${t}`);
        if (t === tab) {
          view.classList.remove('hidden');
          nav.className = 'flex-1 py-2 rounded-xl text-center font-bold active-nav-tab transition-all flex items-center justify-center gap-1.5';
        } else {
          view.classList.add('hidden');
          nav.className = 'flex-1 py-2 rounded-xl text-center text-stone-400 hover:text-stone-200 transition-all flex items-center justify-center gap-1.5';
        }
      });
      lucide.createIcons();
    }

    // Lightbox
    function openLightbox() {
      document.getElementById('lightbox-modal').classList.add('active');
    }
    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
