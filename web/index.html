<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ribbon Clock | ライブ・タイテ情報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            rose: {
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              950: '#4c0519',
            },
            ayu: {
              red: '#ef4444',
              darkred: '#7f1d1d',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Hiragino Sans"', '"Hiragino Kaku Gothic ProN"', '"Noto Sans JP"', 'sans-serif'],
            display: ['-apple-system', 'BlinkMacSystemFont', '"Hiragino Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="h-[100dvh] overflow-hidden antialiased selection:bg-rose-500/20 flex flex-col">

  <!-- Mobile Frame (Max width 420px for perfect one-handed mobile view) -->
  <div class="mx-auto max-w-sm w-full px-3.5 pt-3 flex flex-col h-full min-h-0 relative">

    <!-- Top App Bar: Minimal & Clean Header (押し感付きロゴ ＆ 鮮度インジケーター) -->
    <header class="flex-shrink-0 flex items-center justify-between py-1 border-b border-white/5 pb-2">
      <button onclick="handleLogoClick()" class="flex items-center gap-2 py-1 px-2 -ml-2 rounded-xl hover:bg-white/5 active:scale-90 transition-all duration-150 select-none group cursor-pointer focus:outline-none" title="直近ライブへジャンプ">
        <span id="logo-icon" class="text-xl inline-block transition-transform duration-200 group-hover:scale-110">🎀</span>
        <span class="text-base font-extrabold text-white tracking-wide group-hover:text-rose-300 transition-colors">リボンクロック</span>
      </button>

      <!-- 鮮度・オフラインインジケーター (通常時は非表示、通信失敗または24h経過時のみ控えめに表示) -->
      <div id="freshness-indicator" class="hidden items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[10px] font-bold">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
        <span id="freshness-text">キャッシュ表示中</span>
      </div>
    </header>



    <!-- ======================================================== -->
    <!-- VIEW CONTAINER: [SMOOTH TOUCH-SWIPE CAROUSEL CONTAINER] -->
    <!-- ======================================================== -->
    
    <!-- カルーセルスライダー (各タブが独立した縦スクロールを持ち、横スワイプで吸着) -->
    <div id="views-carousel" class="flex-1 min-h-0 flex overflow-x-auto snap-x snap-mandatory no-scrollbar w-full scroll-smooth">
      
      <!-- 1. [NEXT LIVE COCKPIT VIEW SLIDE] -->
      <main id="tab-content-next" class="tab-slide w-full shrink-0 snap-start h-full overflow-y-auto no-scrollbar space-y-3 px-0.5 pt-2 pb-24">

      <!-- 同日2回し切り替えピル (1部 / 2部) - コックピット内のみ表示 -->
      <div id="session-pills-bar" class="hidden flex gap-1.5 overflow-x-auto pb-0.5">
        <!-- JSでピルボタンを自動注入 -->
      </div>

      <!-- 他日程の公演詳細を閲覧中のみ表示される「直近ライブに戻る」トップバー -->
      <div id="subpage-return-bar" class="hidden flex items-center justify-between px-1 py-1 -mb-1">
        <span class="text-xs text-stone-400 font-medium">別日程の公演を表示中</span>
        <button onclick="goToNextLive()" class="flex items-center gap-1.5 py-1 px-2.5 rounded-full bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-300 active:scale-95 text-xs font-bold transition-all shadow-sm">
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-rose-400"></i>
          <span>直近ライブに戻る</span>
        </button>
      </div>

      <!-- EVENT TITLE (最上段にイベント名を堂々と配置) -->
      <div class="px-1 pt-0.5">
        <h1 id="live-title" class="text-lg font-black text-white leading-snug drop-shadow-sm">
          --
        </h1>
      </div>

      <!-- HERO FLYER & TIMETABLE PREVIEW (複数画像対応・タップで拡大) -->
      <section class="space-y-1.5">
        <div class="rounded-2xl overflow-hidden soft-card shadow-xl cursor-pointer group active:scale-[0.98] transition-all duration-150" onclick="openLightbox()">
          <div class="relative w-full h-44 bg-stone-950 overflow-hidden flex items-center justify-center">
            <img id="hero-strip-img" 
                 src="" 
                 alt="Flyer visual preview" 
                 referrerpolicy="no-referrer"
                 onerror="handleImageFallback(this)"
                 class="w-full h-full object-cover object-top opacity-95 group-hover:scale-105 transition-transform duration-300">
            
            <!-- Tap hint overlay: 拡大アイコン ＆ 複数画像カウント -->
            <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5 p-1.5 rounded-lg bg-stone-950/80 backdrop-blur-md border border-white/20 text-white shadow">
              <span id="hero-img-count-badge" class="hidden text-[11px] font-bold text-rose-300 px-0.5">1/2</span>
              <i data-lucide="maximize-2" class="w-3.5 h-3.5 text-rose-300"></i>
            </div>
          </div>
        </div>

        <!-- 複数画像がある場合の切り替えピル (フライヤー ⇄ タイムテーブル) -->
        <div id="hero-image-pills" class="hidden flex items-center gap-1.5 px-0.5">
          <!-- JSで自動注入 -->
        </div>
      </section>

      <!-- PRIMARY COCKPIT TELEMETRY CARD -->
      <section class="soft-card rounded-2xl p-3.5 space-y-3 shadow-xl">
        
        <!-- 【日程表示】(時間帯のすぐ上に配置！) -->
        <div class="flex items-center justify-between pb-2 border-b border-white/5">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 border border-rose-500/30">公演日</span>
            <span id="live-date-header" class="text-base font-black text-white tracking-tight">--/-- (--)</span>
          </div>
          <span id="live-relative-day" class="text-xs font-bold text-rose-400"></span>
        </div>

        <!-- 【時間帯表示】(出番ハイライト ＆ 特典会) -->
        <div class="grid grid-cols-2 gap-2.5">
          
          <!-- Stage Live Time (主役：赤・ローズグラデーションで強調) -->
          <div class="bg-gradient-to-br from-rose-950/60 to-stone-900/90 rounded-xl px-3 py-2.5 space-y-1 border-2 border-rose-500/60 shadow-lg shadow-rose-950/40">
            <div class="flex items-center justify-between text-xs font-bold text-rose-300">
              <span class="flex items-center gap-1.5">
                <i data-lucide="mic" class="w-4 h-4 text-rose-400"></i>
                <span>ライブ出番</span>
              </span>
            </div>
            <div class="flex items-baseline gap-0.5 pt-0.5">
              <span id="live-start" class="text-xl font-display font-black text-white tracking-tight shrink-0">--:--</span>
              <span class="text-[11px] font-display text-stone-400 px-0.5 shrink-0">〜</span>
              <span id="live-end" class="text-xs font-display font-bold text-rose-200 tracking-tight shrink-0">--:--</span>
            </div>
            <div id="live-stage" class="text-xs text-rose-300 font-semibold truncate pt-0.5">--</div>
          </div>

          <!-- Benefit Merch Time (サブ：落ち着いた通常カード) -->
          <div class="bg-stone-900/80 rounded-xl px-3 py-2.5 space-y-1 border border-white/10">
            <div class="flex items-center justify-between text-xs font-bold text-stone-300">
              <span class="flex items-center gap-1.5">
                <i data-lucide="camera" class="w-4 h-4 text-stone-400"></i>
                <span id="benefit-type-label">特典会</span>
              </span>
            </div>
            <div class="flex items-baseline gap-0.5 pt-0.5">
              <span id="benefit-start" class="text-xl font-display font-black text-stone-200 tracking-tight shrink-0">--:--</span>
              <span class="text-[11px] font-display text-stone-500 px-0.5 shrink-0">〜</span>
              <span id="benefit-end" class="text-xs font-display font-bold text-stone-400 tracking-tight shrink-0">--:--</span>
            </div>
            <div id="benefit-booth" class="text-xs text-stone-400 font-medium truncate pt-0.5">--</div>
          </div>

        </div>

        <!-- High-Priority Highlights: 撮可ルール & 指名入場特典 -->
        <div class="space-y-2 text-xs pt-0.5">
          
          <div id="photo-box" class="flex items-start gap-2.5 py-2 px-3 rounded-xl bg-stone-900/70 border border-white/5">
            <i data-lucide="aperture" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div class="text-xs leading-relaxed">
              <span class="font-bold text-white" id="photo-status">撮可：</span>
              <span id="photo-desc" class="text-stone-200 font-medium">--</span>
            </div>
          </div>

          <div id="bonus-box" class="flex items-start gap-2.5 py-2 px-3 rounded-xl bg-stone-900/70 border border-white/5">
            <i data-lucide="gift" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div class="text-xs leading-relaxed">
              <span class="font-bold text-white">指名特典：</span>
              <span id="bonus-desc" class="text-stone-200 font-medium">--</span>
            </div>
          </div>

          <!-- Special Notes (コスプレ等) -->
          <div id="special-notes-box" class="hidden flex items-start gap-2.5 py-2 px-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-200">
            <i data-lucide="sparkles" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
            <div id="special-notes-desc" class="text-xs font-semibold leading-relaxed">--</div>
          </div>

        </div>

        <!-- Ticket Pricing Preview -->
        <div id="ticket-prices-box" class="pt-1.5 border-t border-white/5 space-y-1.5">
          <div class="flex items-center justify-between text-xs text-stone-400 font-semibold px-0.5">
            <span>チケット料金</span>
            <span class="text-[11px] text-stone-500 font-normal">※各チケット+1D</span>
          </div>
          <div id="ticket-prices-list" class="flex flex-wrap gap-1.5">
            <!-- JSで注入 -->
          </div>
        </div>

        <!-- 【会場情報 ＆ アクションボタン】(会場ボタンの直上に会場名を目立つように配置！) -->
        <div class="pt-2 border-t border-white/5 space-y-2">
          <!-- 目立つ会場名バー -->
          <div class="flex items-center justify-between bg-stone-900/90 px-3 py-2 rounded-xl border border-white/10">
            <div class="flex items-center gap-2 min-w-0">
              <i data-lucide="map-pin" class="w-4 h-4 text-rose-400 shrink-0"></i>
              <span id="live-venue-name" class="text-base font-black text-white truncate">--</span>
            </div>
            <span class="text-xs text-rose-300 font-bold shrink-0">会場</span>
          </div>

          <!-- 会場マップ ＆ チケット購入 (親指操作) -->
          <div class="grid grid-cols-2 gap-2">
            <a id="venue-map-link" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-stone-200 font-bold text-xs border border-white/10 transition-colors">
              <i data-lucide="navigation" class="w-3.5 h-3.5 text-rose-400"></i>
              <span>会場マップ</span>
            </a>
            <a id="ticket-link" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-1.5 py-2.5 rounded-xl bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-400 hover:to-rose-500 text-stone-950 font-bold text-xs shadow-md transition-all">
              <i data-lucide="ticket" class="w-3.5 h-3.5"></i>
              <span id="ticket-btn-text">チケット</span>
            </a>
          </div>

          <!-- 他日程閲覧時のみカード最下部にも表示される直近ライブ戻り導線 -->
          <div id="subpage-return-bottom" class="hidden pt-1">
            <button onclick="goToNextLive()" class="w-full flex items-center justify-center gap-2 py-2 rounded-xl bg-stone-900/90 hover:bg-stone-800 text-stone-300 hover:text-white border border-white/10 text-xs font-bold active:scale-[0.98] transition-all">
              <i data-lucide="sparkles" class="w-3.5 h-3.5 text-rose-400"></i>
              <span>直近ライブの予定に戻る</span>
            </button>
          </div>


        </div>

      </section>

      <!-- [PROMOTION / AD SLOT CONTAINER] (大・中・小 バリエーション対応コンポーネント) -->
      <section id="promo-container" class="space-y-1.5">
        <!-- JSで動的レンダリング（大中小切替トグル付） -->
      </section>

    </main>

      <!-- 2. [UPCOMING LIVE SCHEDULE LIST SLIDE] -->
      <section id="tab-content-week" class="tab-slide w-full shrink-0 snap-start h-full overflow-y-auto no-scrollbar space-y-3 px-0.5 pt-2 pb-24">
      <div class="flex items-center justify-between px-1">
        <span class="text-sm font-extrabold text-white">ライブ日程一覧</span>
        <span id="upcoming-count-badge" class="text-xs font-bold text-rose-300 bg-rose-500/20 px-2.5 py-0.5 rounded-full border border-rose-500/30">--公演</span>
      </div>
      
      <!-- Upcoming list -->
      <div id="upcoming-list" class="space-y-2.5">
        <!-- JSで日付バッジ付きカードを注入 -->
      </div>
    </section>

      <!-- 3. [MONTHLY CALENDAR VIEW SLIDE] -->
      <section id="tab-content-month" class="tab-slide w-full shrink-0 snap-start h-full overflow-y-auto no-scrollbar space-y-3 px-0.5 pt-2 pb-24">
      <div class="flex items-center justify-between px-1">
        <button onclick="changeCalendarMonth(-1)" class="py-1 px-2 rounded-lg bg-stone-900 border border-white/10 text-xs font-bold text-stone-300 hover:text-white flex items-center gap-1 transition-colors">
          <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
          <span id="prev-month-label">10月</span>
        </button>
        <span id="calendar-header-title" class="text-sm font-extrabold text-white">2026年 11月</span>
        <button onclick="changeCalendarMonth(1)" class="py-1 px-2 rounded-lg bg-stone-900 border border-white/10 text-xs font-bold text-stone-300 hover:text-white flex items-center gap-1 transition-colors">
          <span id="next-month-label">12月</span>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <div class="soft-card rounded-2xl p-3.5 space-y-3 shadow-xl">
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold">
          <span class="text-rose-400 py-1">日</span>
          <span class="text-stone-400 py-1">月</span>
          <span class="text-stone-400 py-1">火</span>
          <span class="text-stone-400 py-1">水</span>
          <span class="text-stone-400 py-1">木</span>
          <span class="text-stone-400 py-1">金</span>
          <span class="text-blue-400 py-1">土</span>
        </div>
        <div id="calendar-cells" class="grid grid-cols-7 gap-1 text-center text-xs">
          <!-- JSで日付セル生成 -->
        </div>
      </div>

      <!-- Selected day details -->
      <div id="calendar-day-detail" class="space-y-2">
        <div class="text-xs text-stone-400 text-center py-2">日付をタップすると詳細が表示されます</div>
      </div>
      </section>

    </div> <!-- End views-carousel -->

    <!-- [FLOATING BOTTOM NAVIGATION] (スワイプに完全追従するリアルタイム・スライディングタブ) -->
    <nav class="fixed bottom-3 left-0 right-0 max-w-sm mx-auto px-3.5 z-40">
      <div class="relative p-1 bg-stone-900/95 backdrop-blur-xl rounded-2xl border border-white/10 shadow-2xl flex items-center text-xs font-medium overflow-hidden">
        
        <!-- スライディング・ピルインジケーター (スワイプ移動量に1:1で完全同期追従) -->
        <div id="nav-indicator" 
             style="width: calc(33.333% - 2px); transform: translateX(0%);" 
             class="absolute top-1 bottom-1 left-1 rounded-xl bg-rose-500 shadow-md will-change-transform transition-transform duration-75 ease-out pointer-events-none z-0">
        </div>

        <button onclick="handleFirstTabClick()" id="nav-next" class="relative z-10 flex-1 py-2.5 rounded-xl text-center font-bold text-stone-950 transition-colors flex items-center justify-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>直近ライブ</span>
        </button>
        <button onclick="setTab('week')" id="nav-week" class="relative z-10 flex-1 py-2.5 rounded-xl text-center font-bold text-stone-400 hover:text-stone-200 transition-colors flex items-center justify-center gap-1.5">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
          <span>全日程</span>
        </button>
        <button onclick="setTab('month')" id="nav-month" class="relative z-10 flex-1 py-2.5 rounded-xl text-center font-bold text-stone-400 hover:text-stone-200 transition-colors flex items-center justify-center gap-1.5">
          <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
          <span>カレンダー</span>
        </button>
      </div>
    </nav>

  </div>

  <!-- [FLOATING FLYER LIGHTBOX MODAL] (背景タップで閉じる・フライヤー＆タイテ切り替え対応) -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex-col justify-between p-3.5" onclick="closeLightbox()">
    <!-- Top Bar: タイトル ＆ 画像切替ピル ＆ 閉じるボタン -->
    <div class="flex items-center justify-between text-xs text-stone-300 pb-2">
      <!-- 複数画像切り替えピル (Lightbox内) -->
      <div id="lightbox-image-pills" class="flex items-center gap-1.5" onclick="event.stopPropagation()">
        <!-- JSで自動注入 -->
      </div>
      <button onclick="closeLightbox()" class="px-2.5 py-1 rounded-full bg-stone-800/90 border border-white/20 text-white font-bold text-xs hover:bg-stone-700 transition-colors">
        ✕ 閉じる
      </button>
    </div>
    
    <!-- Image Floating Container: 画像本体のみstopPropagation、周囲タップで閉じる -->
    <div class="flex-1 flex items-center justify-center p-1 cursor-pointer" onclick="closeLightbox()">
      <img id="lightbox-img" 
           src="" 
           referrerpolicy="no-referrer" 
           alt="Timetable enlarged" 
           onclick="event.stopPropagation()"
           class="max-w-[94vw] max-h-[76vh] object-contain rounded-2xl shadow-2xl ring-1 ring-white/20 cursor-default">
    </div>

    <div class="text-center text-[11px] font-medium text-stone-400 pt-2 pointer-events-none">
      画像の周囲をタップして閉じる
    </div>
  </div>

  <!-- APPLICATION LOGIC (Cleanly separated from markup) -->
  <script src="app.js"></script>
</body>
</html>
