name: Preview Environment CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/aobaiwaki123/taite-board
  MONITOR_IMAGE_NAME: ghcr.io/aobaiwaki123/taite-board-monitor

jobs:
  preview-build:
    name: Build and push preview images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        run: |
          set -euo pipefail
          pr_num="${{ github.event.number }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          short_sha="sha-${head_sha:0:7}"
          docker build \
            --tag "${IMAGE_NAME}:pr-${pr_num}" \
            --tag "${IMAGE_NAME}:${short_sha}" \
            .
          docker push "${IMAGE_NAME}:pr-${pr_num}"
          docker push "${IMAGE_NAME}:${short_sha}"

      - name: Build and push monitor image
        run: |
          set -euo pipefail
          pr_num="${{ github.event.number }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          short_sha="sha-${head_sha:0:7}"
          docker build \
            --file deploy/monitor.Dockerfile \
            --tag "${MONITOR_IMAGE_NAME}:pr-${pr_num}" \
            --tag "${MONITOR_IMAGE_NAME}:${short_sha}" \
            .
          docker push "${MONITOR_IMAGE_NAME}:pr-${pr_num}"
          docker push "${MONITOR_IMAGE_NAME}:${short_sha}"
