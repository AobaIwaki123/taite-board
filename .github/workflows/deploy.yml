name: Deploy ribonclock

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - k8s/manifests/**
  workflow_dispatch:

concurrency:
  group: gitops-deploy
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/aobaiwaki123/taite-board
  ACCESS_REPORT_IMAGE_NAME: ghcr.io/aobaiwaki123/taite-board-access-report
  MONITOR_IMAGE_NAME: ghcr.io/aobaiwaki123/taite-board-monitor

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          set -euo pipefail
          short_sha="sha-${GITHUB_SHA:0:7}"
          tags="--tag ${IMAGE_NAME}:${short_sha}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tags="${tags} --tag ${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          docker build ${tags} .
          docker push "${IMAGE_NAME}:${short_sha}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

      - name: Build and push access report image
        run: |
          set -euo pipefail
          short_sha="sha-${GITHUB_SHA:0:7}"
          docker build \
            --file deploy/access-report.Dockerfile \
            --tag "${ACCESS_REPORT_IMAGE_NAME}:${short_sha}" \
            .
          docker push "${ACCESS_REPORT_IMAGE_NAME}:${short_sha}"

      - name: Build and push monitor image
        run: |
          set -euo pipefail
          short_sha="sha-${GITHUB_SHA:0:7}"
          tags="--tag ${MONITOR_IMAGE_NAME}:${short_sha}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tags="${tags} --tag ${MONITOR_IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          docker build \
            --file deploy/monitor.Dockerfile \
            ${tags} \
            .
          docker push "${MONITOR_IMAGE_NAME}:${short_sha}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            docker push "${MONITOR_IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

      - name: Update GitOps image tag
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          short_sha="sha-${GITHUB_SHA:0:7}"

          git fetch origin main
          git checkout origin/main

          sed -i -E "s#(image: ${IMAGE_NAME}:).*#\1${short_sha}#" k8s/manifests/deployment.yaml
          sed -i -E "s#(image: ${MONITOR_IMAGE_NAME}:).*#\1${short_sha}#" k8s/manifests/deployment.yaml
          sed -i -E "s#(image: ${ACCESS_REPORT_IMAGE_NAME}:).*#\1${short_sha}#" k8s/manifests/access-report-cronjob.yaml

          if git diff --quiet -- k8s/manifests/deployment.yaml k8s/manifests/access-report-cronjob.yaml; then
            echo 'Image tag is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/manifests/deployment.yaml k8s/manifests/access-report-cronjob.yaml
          git commit -m "chore(deploy): update ribonclock images to ${short_sha} [skip ci]"
          git push origin HEAD:main

