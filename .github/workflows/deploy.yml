name: Deploy ribonclock

on:
  push:
    branches:
      - main
    paths-ignore:
      - k8s/manifests/**
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: gcr.io/my-docker-471807/ribonclock

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push image
        run: |
          set -euo pipefail
          short_sha="sha-${GITHUB_SHA:0:7}"
          docker build --tag "${IMAGE_NAME}:${short_sha}" .
          docker push "${IMAGE_NAME}:${short_sha}"

      - name: Update GitOps image tag
        run: |
          set -euo pipefail
          short_sha="sha-${GITHUB_SHA:0:7}"
          sed -i -E "s#(image: ${IMAGE_NAME}:).*#\1${short_sha}#" k8s/manifests/deployment.yaml

          if git diff --quiet -- k8s/manifests/deployment.yaml; then
            echo 'Image tag is already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/manifests/deployment.yaml
          git commit -m "chore(deploy): update ribonclock image to ${short_sha} [skip ci]"
          git push origin HEAD:main

