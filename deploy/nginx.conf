map $request_uri $privacy_route {
    default other;
    ~^/(\?.*)?$ document;
    ~^/index\.html(\?.*)?$ document;
    ~^/schedule\.json(\?.*)?$ schedule;
    ~^/mock_schedule\.json(\?.*)?$ schedule;
    ~^/data/(groups\.json|groups/.*/schedule\.json|events/.*\.json)(\?.*)?$ schedule;
    ~^/api/sync/ sync;
    ~^/(admin|api/admin|graph|arch)(/|\?|$) admin;
    ~^/(assets|icons|images|favicon\.png|manifest\.webmanifest|robots\.txt|og-image\.png)(/|\?|$) asset;
}

log_format privacy_json escape=json
    '{"ts":"$time_iso8601","route":"$privacy_route","status":$status}';

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout privacy_json;
    access_log /var/log/ribonclock/access.log privacy_json;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Proxy dynamic schedule & event JSON from GCS (falls back to bundled static files if unavailable)
    location = /schedule.json {
        proxy_pass https://storage.googleapis.com/taite-board-data/schedule.json;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @local_fallback;
    }

    location = /mock_schedule.json {
        proxy_pass https://storage.googleapis.com/taite-board-data/mock_schedule.json;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @local_fallback;
    }

    location = /data/groups.json {
        proxy_pass https://storage.googleapis.com/taite-board-data/data/groups.json;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @local_fallback;
    }

    location ^~ /data/groups/ {
        proxy_pass https://storage.googleapis.com/taite-board-data/data/groups/;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @local_fallback;
    }

    location ^~ /data/events/ {
        proxy_pass https://storage.googleapis.com/taite-board-data/data/events/;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @local_fallback;
    }

    location @local_fallback {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Proxy authenticated user expense & attendance sync API to dedicated port (8083)
    location ^~ /api/sync/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    # Serve Preact Admin UI from the Web bundle (/api/admin/* stays RBAC-protected on :8083)
    location = /admin {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /admin/ {
        return 302 /admin$is_args$args;
    }

    location = /graph {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /graph/ {
        return 302 /graph$is_args$args;
    }

    location = /arch {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /arch/ {
        return 302 /arch$is_args$args;
    }

    location = /admin/dashboard {
        proxy_pass http://127.0.0.1:8083/admin/dashboard;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-cache" always;
    }

    location = /admin/dashboard/ {
        proxy_pass http://127.0.0.1:8083/admin/dashboard/;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        # This is a static site without client-side routes. Keep unknown paths
        # observable as 404 instead of masking them with the home page.
        try_files $uri $uri/ =404;
    }
}
