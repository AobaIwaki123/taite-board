map $request_uri $privacy_route {
    default other;
    ~^/(\?.*)?$ document;
    ~^/index\.html(\?.*)?$ document;
    ~^/schedule\.json(\?.*)?$ schedule;
    ~^/mock_schedule\.json(\?.*)?$ schedule;
    ~^/(assets|icons|images)(/|\?|$) asset;
}

log_format privacy_json escape=json
    '{"ts":"$time_iso8601","route":"$privacy_route","status":$status}';

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout privacy_json;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        # This is a static site without client-side routes. Keep unknown paths
        # observable as 404 instead of masking them with the home page.
        try_files $uri $uri/ =404;
    }
}

