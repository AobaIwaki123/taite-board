apiVersion: v1
kind: Service
metadata:
  name: ribonclock-preview
  labels:
    app.kubernetes.io/name: ribonclock
spec:
  selector:
    app.kubernetes.io/name: ribonclock
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: dashboard
      port: 8082
      targetPort: dashboard
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
