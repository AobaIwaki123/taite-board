apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    blueGreen:
      activeService: ribonclock
      previewService: ribonclock-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app.kubernetes.io/name: ribonclock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ribonclock
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: web
          image: ghcr.io/aobaiwaki123/taite-board:sha-b64d705
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/ribonclock
        - name: monitor
          image: ghcr.io/aobaiwaki123/taite-board-monitor:sha-b64d705
          imagePullPolicy: IfNotPresent
          env:
            - name: AI_PARSER_URL
              value: "https://taite-parser-3b7eomko6a-an.a.run.app"
            - name: GCS_DATA_BUCKET
              value: "taite-board-data"
            - name: GCS_STATE_BUCKET
              value: "taite-board-state"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/gcs/key.json"
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: ribonclock-auth
                  key: GCP_PROJECT_ID
                  optional: true
            - name: IDENTITY_PLATFORM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ribonclock-auth
                  key: IDENTITY_PLATFORM_API_KEY
                  optional: true
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: ribonclock-access-report
                  key: DISCORD_WEBHOOK_URL
                  optional: true
          ports:
            - name: dashboard
              containerPort: 8082
              protocol: TCP
            - name: sync
              containerPort: 8083
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: log-volume
              mountPath: /var/log/ribonclock
            - name: gcs-key
              mountPath: /var/secrets/gcs
              readOnly: true
      volumes:
        - name: log-volume
          emptyDir: {}
        - name: gcs-key
          secret:
            secretName: ribonclock-gcs
