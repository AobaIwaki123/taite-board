apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ribonclock
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ribonclock
      release: kube-prometheus-stack
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
