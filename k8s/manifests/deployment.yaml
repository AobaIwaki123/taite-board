apiVersion: apps/v1
kind: Deployment
metadata:
  name: ribonclock
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ribonclock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ribonclock
    spec:
      containers:
        - name: web
          image: ghcr.io/aobaiwaki123/taite-board:sha-1f68dc3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false

