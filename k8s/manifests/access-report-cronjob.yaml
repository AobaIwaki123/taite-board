apiVersion: v1
kind: ServiceAccount
metadata:
  name: ribonclock-access-report
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock-access-report
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ribonclock-access-report
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock-access-report
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ribonclock-access-report
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock-access-report
subjects:
  - kind: ServiceAccount
    name: ribonclock-access-report
    namespace: ribonclock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ribonclock-access-report

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ribonclock-access-report
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock-access-report
spec:
  # Temporary five-minute cadence with a six-hour lookback for operational verification.
  schedule: "*/5 * * * *"
  # Keep suspended until log persistence across Pod replacement is designed.
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ribonclock-access-report
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ribonclock-access-report
        spec:
          serviceAccountName: ribonclock-access-report
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reporter
              image: ghcr.io/aobaiwaki123/taite-board-access-report:sha-2c223bd
              imagePullPolicy: IfNotPresent
              args:
                - --last-minutes
                - "360"
                - --kubernetes-api
              env:
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: ribonclock-access-report
                      key: DISCORD_WEBHOOK_URL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
