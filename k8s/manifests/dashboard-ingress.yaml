apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ribonclock-dashboard
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock-dashboard
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: ribonclock-dashboard.aooba.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ribonclock
                port:
                  name: dashboard
