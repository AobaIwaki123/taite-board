apiVersion: v1
kind: Service
metadata:
  name: ribonclock-dashboard
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock-dashboard
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "ribonclock-dashboard"
spec:
  selector:
    app.kubernetes.io/name: ribonclock
  ports:
    - name: http
      port: 80
      targetPort: 8082
      protocol: TCP
