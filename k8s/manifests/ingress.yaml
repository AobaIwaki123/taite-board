apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ribonclock
  namespace: ribonclock
  labels:
    app.kubernetes.io/name: ribonclock
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: ribonclock.chekipla.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ribonclock
                port:
                  name: http

