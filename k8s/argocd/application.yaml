apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taite-board
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: web=ghcr.io/aobaiwaki123/taite-board,monitor=ghcr.io/aobaiwaki123/taite-board-monitor
    argocd-image-updater.argoproj.io/web.update-strategy: latest
    argocd-image-updater.argoproj.io/web.allow-tags: regexp:^sha-[a-f0-9]{7}$
    argocd-image-updater.argoproj.io/monitor.update-strategy: latest
    argocd-image-updater.argoproj.io/monitor.allow-tags: regexp:^sha-[a-f0-9]{7}$
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/AobaIwaki123/taite-board.git
    targetRevision: main
    path: k8s/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: ribonclock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

